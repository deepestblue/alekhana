name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: $/.github/workflows/build.yml
    permissions:
      contents: read
  package_and_release:
    needs: [build]
    name: Package up artifacts and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the release and upload assets.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check VERSION matches tag
        run: |
          EXPECTED="v$(cat VERSION | tr -d '[:space:]')"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION file (expected ${EXPECTED})" >&2
            exit 1
          fi
      - name: Download MacOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: MacOS distrib
          path: mac_dist
      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Windows distrib
          path: win_dist
      # Workaround for https://github.com/actions/upload-artifact/issues/38
      - name: Fix perms
        run: chmod +x mac_dist/*
      - name: Package per-platform archives
        run: |
          mkdir "alekhana-macos-${GITHUB_REF_NAME}" "alekhana-windows-${GITHUB_REF_NAME}"
          cp -r mac_dist/. "alekhana-macos-${GITHUB_REF_NAME}/"
          cp -r win_dist/. "alekhana-windows-${GITHUB_REF_NAME}/"
          tar czf "alekhana-macos-${GITHUB_REF_NAME}.tar.gz" "alekhana-macos-${GITHUB_REF_NAME}"
          zip -r "alekhana-windows-${GITHUB_REF_NAME}.zip" "alekhana-windows-${GITHUB_REF_NAME}"
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "alekhana-macos-${GITHUB_REF_NAME}.tar.gz" \
            "alekhana-windows-${GITHUB_REF_NAME}.zip" \
            -R "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
